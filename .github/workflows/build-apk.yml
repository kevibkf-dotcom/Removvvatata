
name: Compilar APK Renova tu mente

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Comprobar ZIP
        run: |
          if [ ! -f "Renova-tu-mente-1000-versiculos-offline.zip" ]; then
            echo "ERROR: No se encontró el ZIP."
            echo "Archivos disponibles:"
            ls -lah
            exit 1
          fi

          echo "ZIP encontrado correctamente."

      - name: Extraer ZIP
        run: |
          rm -rf renova
          mkdir -p renova

          unzip -q \
            "Renova-tu-mente-1000-versiculos-offline.zip" \
            -d renova

          echo "ZIP extraído correctamente."

      - name: Buscar proyecto Android
        run: |
          SETTINGS=$(find renova -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            echo ""
            echo "Contenido del ZIP:"
            unzip -l "Renova-tu-mente-1000-versiculos-offline.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Verificar proyecto
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "VERIFICANDO PROYECTO"
          echo "======================================"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -s "$PROJECT_DIR/app/src/main/assets/content.json"

          echo "Proyecto Android correcto."

      - name: Mostrar información
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "CONTENIDO OFFLINE"
          echo "======================================"

          du -h "$PROJECT_DIR/app/src/main/assets/content.json"

      - name: Compilar APK Debug
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "APK"
          echo "======================================"

          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No se generó la APK."
            exit 1
          fi

          echo "APK generada correctamente."

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Renova-tu-mente-APK
          path: "renova/**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
