
name: Compilar APK Renova tu mente

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar componentes Android
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager"
            exit 1
          fi

          echo "Usando sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verificar ZIP
        run: |
          ZIP="Renova-tu-mente-PROYECTO-COMPLETO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró:"
            echo "$ZIP"
            echo ""
            echo "Archivos disponibles:"
            ls -lah
            exit 1
          fi

          echo "ZIP encontrado:"
          ls -lh "$ZIP"

      - name: Extraer proyecto
        run: |
          rm -rf renova
          mkdir -p renova

          unzip -q \
            "Renova-tu-mente-PROYECTO-COMPLETO.zip" \
            -d renova

          echo "ZIP extraído."

      - name: Buscar proyecto Android
        run: |
          SETTINGS=$(find renova -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle dentro del ZIP."
            echo ""
            echo "Contenido del ZIP:"
            unzip -l "Renova-tu-mente-PROYECTO-COMPLETO.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Verificar estructura
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "VERIFICANDO PROYECTO"
          echo "======================================"

          test -f "$PROJECT_DIR/settings.gradle" || {
            echo "ERROR: falta settings.gradle"
            exit 1
          }

          test -f "$PROJECT_DIR/build.gradle" || {
            echo "ERROR: falta build.gradle"
            exit 1
          }

          test -f "$PROJECT_DIR/gradle.properties" || {
            echo "ERROR: falta gradle.properties"
            exit 1
          }

          test -d "$PROJECT_DIR/app" || {
            echo "ERROR: falta app/"
            exit 1
          }

          test -f "$PROJECT_DIR/app/build.gradle" || {
            echo "ERROR: falta app/build.gradle"
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || {
            echo "ERROR: falta AndroidManifest.xml"
            exit 1
          }

          test -s "$PROJECT_DIR/app/src/main/assets/content.json" || {
            echo "ERROR: falta content.json o está vacío"
            exit 1
          }

          echo "Proyecto correcto."

      - name: Verificar contenido offline
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "CONTENIDO OFFLINE"
          echo "======================================"

          du -h "$PROJECT_DIR/app/src/main/assets/content.json"

          echo "Contenido bíblico encontrado."

      - name: Compilar APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "COMPILANDO APK"
          echo "======================================"

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "APK GENERADA"
          echo "======================================"

          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No se generó ninguna APK."
            exit 1
          fi

          echo "APK generada correctamente."

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Renova-tu-mente-APK
          path: "renova/**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
