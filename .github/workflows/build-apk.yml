```yaml
name: "Compilar APK Renova tu mente sin conexión"

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "Descargar proyecto"
        uses: actions/checkout@v4

      - name: "Configurar Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Instalar Android SDK"
        uses: android-actions/setup-android@v3

      - name: "Instalar componentes Android"
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: "Configurar Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: "Verificar ZIP"
        run: |
          ZIP="Renova-tu-mente-1000-versiculos-offline.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP:"
            echo "$ZIP"
            echo ""
            echo "Archivos disponibles:"
            ls -lah
            exit 1
          fi

          echo "ZIP encontrado correctamente:"
          ls -lh "$ZIP"

      - name: "Extraer proyecto"
        run: |
          rm -rf renova
          mkdir -p renova

          unzip -q "Renova-tu-mente-1000-versiculos-offline.zip" -d renova

          echo "Proyecto extraído."

      - name: "Detectar carpeta del proyecto"
        run: |
          SETTINGS=$(find renova -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle dentro del ZIP."
            echo ""
            echo "Contenido del ZIP:"
            unzip -l "Renova-tu-mente-1000-versiculos-offline.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: "Verificar estructura"
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          test -f "$PROJECT_DIR/settings.gradle" || exit 1
          test -f "$PROJECT_DIR/build.gradle" || exit 1
          test -f "$PROJECT_DIR/gradle.properties" || exit 1
          test -d "$PROJECT_DIR/app" || exit 1
          test -f "$PROJECT_DIR/app/build.gradle" || exit 1
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || exit 1
          test -s "$PROJECT_DIR/app/src/main/assets/content.json" || exit 1

          echo "======================================"
          echo "ESTRUCTURA CORRECTA"
          echo "======================================"

      - name: "Verificar contenido offline"
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "Contenido bíblico offline:"
          du -h "$PROJECT_DIR/app/src/main/assets/content.json"

          echo "Contenido encontrado correctamente."

      - name: "Compilar APK"
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: "Verificar APK"
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "APK GENERADA"
          echo "======================================"

          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No se generó ninguna APK."
            exit 1
          fi

      - name: "Publicar APK"
        uses: actions/upload-artifact@v4
        with:
          name: "Renova-tu-mente-APK-sin-conexion"
          path: "renova/**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
```
